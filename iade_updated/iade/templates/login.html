<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İade Takip Sistemi - Giriş</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f5f3;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:2rem;width:100%;max-width:380px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
h1{font-size:18px;font-weight:700;margin-bottom:.4rem;color:#1a1a1a}
p{font-size:12px;color:#888;margin-bottom:1.5rem}
label{font-size:11px;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:4px}
input{width:100%;padding:8px 10px;border:1px solid #ccc;border-radius:6px;font-size:13px;margin-bottom:1rem}
input:focus{outline:none;border-color:#1a56db}
button{width:100%;padding:9px;background:#1a56db;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
button:hover{background:#1447b8}
.error{background:#fee2e2;color:#b91c1c;padding:8px 12px;border-radius:6px;font-size:12px;margin-bottom:1rem}
</style>
</head>
<body>
<div class="card">
  <h1>↩ İade Takip Sistemi</h1>
  <p>Devam etmek için giriş yapın.</p>
  {% if form.errors %}
  <div class="error">Kullanıcı adı veya şifre hatalı.</div>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <label>Kullanıcı Adı</label>
    <input type="text" name="username" autofocus>
    <label>Şifre</label>
    <input type="password" name="password">
    <button type="submit">Giriş Yap</button>
  </form>
  <form method="post" id="loginForm">
    {% csrf_token %}
    <label>Kullanıcı Adı</label>
    <input type="text" name="username" required autofocus>
    <label>Şifre</label>
    <input type="password" name="password" required>
    <button type="submit">Giriş Yap</button>
</form>
  <script>
  document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault(); // Sayfanın kendi kendine yenilenmesini engelle
      
      let formData = new FormData(this);
      
      fetch('/login/', { // URL'in 'login/' ise
          method: 'POST',
          body: formData
      })
      .then(response => response.json())
      .then(data => {
          if (data.success) {
              // BAŞARILI: Yönlendirmeyi burada yapıyoruz
              window.location.href = data.redirect_url; 
          } else {
              // HATA: Mesajı ekranda göster
              alert(data.error); 
          }
      })
      .catch(error => console.error('Hata:', error));
  });
  </script>
</div>
</body>
</html>
